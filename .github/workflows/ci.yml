name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SDK préversion épinglé par global.json.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Microsoft.Testing.Platform (section "test" de global.json) : dotnet test --project.
      - run: dotnet test --project tests/ShellyBLE.Core.Tests -c Release

  android:
    name: Android (build)
    # Sous Linux, le projet ne cible qu'Android : pas besoin des workloads iOS / Mac Catalyst.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet workload install maui-android

      # Installe la plateforme Android visée par le TFM si l'image du runner ne l'a pas encore.
      - run: >
          dotnet build src/ShellyBLE/ShellyBLE.csproj -f net11.0-android
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSDKLicenses=True

      - run: >
          dotnet build src/ShellyBLE/ShellyBLE.csproj -f net11.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
